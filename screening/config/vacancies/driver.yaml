# Delivery driver (repartidor): Grupo Sazón's original role.
# The seven fields of the first version, unchanged: every field is required, the
# license and the city are knockouts, and nothing contributes to the preference score.
#
# Field keys (CONTRACTS §7): name, type, requirement (required | preferred | off),
# label (what to ask, per language), and optionally weight, options, reason,
# summary (read-back noun), option_labels and exclusive_options.

id: driver
title:
  es: Repartidor
  en: Delivery driver

fields:
  - name: full_name
    type: text
    requirement: required
    label:
      es: nombre y apellido
      en: first name and surname

  - name: has_driver_license
    type: boolean
    requirement: required
    reason: license  # outcome strings stay no_license / license_unclear
    label:
      es: si tiene carnet de conducir en vigor (sí o no)
      en: whether they have a valid driver's license (yes or no)
    summary:
      es_ES: carnet de conducir
      es_MX: licencia de manejo
      en: driver's license

  - name: location
    type: city
    requirement: required
    label:
      es: en qué ciudad vive, y el barrio
      en: which city they live in, and the neighborhood

  - name: availability
    type: enum_multi
    requirement: required
    options: [full_time, part_time, weekends]
    label:
      es: si busca jornada completa, media jornada o fines de semana (se pueden combinar)
      en: whether they want full-time, part-time or weekends (combinations are fine)
    option_labels:
      full_time: {es_ES: jornada completa, es_MX: tiempo completo, en: full-time}
      part_time: {es_ES: media jornada, es_MX: medio tiempo, en: part-time}
      weekends: {es: fines de semana, en: weekends}

  - name: schedule
    type: enum_multi
    requirement: required
    options: [morning, afternoon, evening, flexible]
    exclusive_options: [flexible]
    label:
      es: qué turnos le van bien, mañanas, tardes, noches o flexible
      en: which shifts suit them, mornings, afternoons, evenings or flexible
    option_labels:
      morning: {es: mañanas, en: mornings}
      afternoon: {es: tardes, en: afternoons}
      evening: {es: noches, en: evenings}
      flexible: {es: horario flexible, en: flexible hours}

  - name: experience
    type: experience
    requirement: required
    label:
      es: si ha trabajado antes en reparto (Glovo, Uber Eats, Just Eat, Rappi, DiDi Food...) y cuánto tiempo; no tener experiencia está bien
      en: whether they have done delivery work before (Glovo, Uber Eats, Just Eat, Rappi, DiDi Food...) and for how long; none is fine

  - name: start_date
    type: date
    requirement: required
    label:
      es: cuándo podría empezar
      en: when they could start
