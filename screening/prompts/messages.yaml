# Fixed messages: sent word for word, never written by the LLM.
# Purpose: these carry legal or outcome meaning (AI disclosure, privacy link,
# disqualification wording, the read-back of stored answers), so they must be
# exact, reviewable and identical every time.
#
# Keys: "es" and "en"; a country key ("es_ES", "es_MX") overrides "es" where the
# vocabulary differs. Placeholders:
#   {name}     ", Laura" when the first name is known, otherwise empty
#   {summary}  the read-back of stored answers, built by code
#   {city}     the city the candidate named
#   {requirement} a field's read-back noun, e.g. "carnet de conducir"
#   {job}, {questions}  the vacancy's title (lowercase) and how many fields it asks
#   {privacy_url}

opening:
  es: "¡Hola! Soy Alex, el asistente virtual (IA) de Grupo Sazón 👋 Son {questions} preguntas rápidas sobre el puesto de {job}, unos 3 minutos. Tus datos solo se usan para esta candidatura: {privacy_url}. ¿Empezamos?"
  en: "Hi! I'm Alex, Grupo Sazón's virtual assistant (AI) 👋 It's {questions} quick questions about the {job} job, about 3 minutes. Your details are only used for this application: {privacy_url}. Shall we start?"

readback:
  es: "¡Gracias{name}! Repasemos: {summary}. ¿Está todo bien?"
  en: "Thanks{name}! Quick check: {summary}. Is everything right?"

# Qualified and needs review get the same close, so nothing implies a rejection.
close_completed:
  es: "¡Listo{name}! Un reclutador de Grupo Sazón te escribirá en los próximos días para concertar una entrevista. ¡Gracias por tu tiempo!"
  en: "All done{name}! A Grupo Sazón recruiter will message you in the next few days to set up an interview. Thanks for your time!"

# A required yes/no field answered "no". {requirement} is the field's read-back
# noun ("carnet de conducir"); the wording names the requirement, never the person.
close_knockout:
  es_ES: "Gracias{name}. Para este puesto es imprescindible tener {requirement}, así que ahora no podemos seguir con tu candidatura; si más adelante cumples este requisito, ¡nos encantará saber de ti!"
  es_MX: "Gracias{name}. Para este puesto es indispensable tener {requirement}, así que ahora no podemos seguir con tu solicitud; si más adelante cumples este requisito, ¡nos encantará saber de ti!"
  en: "Thanks{name}. This role requires a valid {requirement}, so we can't continue with your application right now; if that changes, we'd love to hear from you!"

close_out_of_area:
  es: "Gracias{name}. De momento no contratamos en {city}; si abrimos en tu zona, te avisaremos por aquí."
  en: "Thanks{name}. We're not hiring in {city} yet; if we open in your area, we'll let you know here."

close_opt_out:
  es: "Entendido, no te escribiré más. ¡Mucha suerte!"
  en: "Understood, I won't message you again. Best of luck!"

close_consent_declined:
  es: "Sin problema, no guardaremos tus datos. ¡Mucha suerte!"
  en: "No problem, we won't keep your details. Best of luck!"

close_human_requested:
  es: "Claro, le paso tu conversación a un reclutador de Grupo Sazón, que te escribirá pronto."
  en: "Sure, I'm passing your conversation to a Grupo Sazón recruiter, who will message you soon."

# After the second off-topic, abusive or injected message.
close_flagged:
  es: "Voy a pasar tu candidatura a un reclutador de Grupo Sazón para que la revise. ¡Gracias!"
  en: "I'm passing your application to a Grupo Sazón recruiter to review. Thank you!"

# Any message after the screening has ended (except after an opt-out: silence).
after_close:
  es: "Gracias por escribir. Un reclutador de Grupo Sazón revisará tu candidatura y te contactará."
  en: "Thanks for your message. A Grupo Sazón recruiter will review your application and get in touch."

# The LLM could not be reached after retries; state is unchanged, so repeating works.
holding:
  es: "Perdona, he tenido un problema técnico. ¿Me lo puedes repetir?"
  en: "Sorry, I had a technical problem. Could you say that again?"

media:
  es: "Perdona, todavía no puedo escuchar audios ni ver imágenes. ¿Me lo escribes en un mensaje?"
  en: "Sorry, I can't listen to audio or view images yet. Could you type it in a message?"

# Reminders after silence (15 min, 2 h, 20 h; see screening.yaml). Never sent 21:00-09:00.
reminder_1:
  es: "¿Sigues por ahí{name}? Cuando puedas, contéstame y seguimos donde lo dejamos 🙂"
  en: "Still there{name}? Whenever you're ready, just reply and we'll pick up where we left off 🙂"
reminder_2:
  es: "Hola{name}, te queda muy poco para terminar tu candidatura. ¿Seguimos?"
  en: "Hi{name}, you're almost done with your application. Shall we continue?"
reminder_3:
  es: "Último recordatorio{name}: tu candidatura sigue abierta unas horas más. Si te interesa el puesto, contéstame y terminamos en un par de minutos."
  en: "Last reminder{name}: your application stays open for a few more hours. If you're interested in the job, reply and we'll finish in a couple of minutes."
