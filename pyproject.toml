[project]
name = "sazon-screening"
version = "0.1.0"
description = "Grupo Sazón driver-screening agent (Orbio FDE take-home)"
requires-python = ">=3.12"
dependencies = [
    "django",
    "django-htmx",
    "dj-database-url",
    "psycopg[binary]",
    "whitenoise",
    "gunicorn",
    "pydantic",
    "pyyaml",
    "anthropic",
    "twilio",
    "phonenumbers",
    "dateparser",
    "rapidfuzz",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "time-machine",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# No global DJANGO_SETTINGS_MODULE: engine and evals tests must run with no Django at all.
# App tests set it themselves (see CLAUDE.md commands) since pytest-django needs it at
# configure time, before any conftest.py would get a chance to.
pythonpath = ["."]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
