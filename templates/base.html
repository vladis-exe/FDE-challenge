{% load static django_htmx %}<!doctype html>
<html lang="{% block lang %}es{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Grupo Sazón{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  {% block head %}{% endblock %}
  {% htmx_script %}
</head>
<body class="{% block body_class %}{% endblock %}" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
</body>
</html>
